spring:
  datasource:
    url: jdbc:mysql://localhost:13309/ordertogether?serverTimezone=Asia/Seoul
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations:
      - classpath:db/migration
      - classpath:db/seed

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  thymeleaf:
    cache: false

payment:
  recovery:
    enabled: true
    max-retry-count: 3
    retry-interval-seconds: 120
