spring:
  datasource:
    url: jdbc:mysql://localhost:13309/ordertogether?serverTimezone=Asia/Seoul
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations:
      - classpath:db/migration
      - classpath:db/seed

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  thymeleaf:
    cache: false

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: payment-group
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
    listener:
      concurrency: 1
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: -1 #all
      transaction-id-prefix: "payment-tx-"

payment:
  recovery:
    enabled: false
    max-retry-count: 3
    min-age-seconds: 120

server:
  tomcat:
    mbeanregistry:
      enabled: true

management:
  endpoint:
    health:
      show-components: always
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  level:
    org.springframework.kafka: DEBUG
    org.springframework.kafka.listener: TRACE
    org.springframework.kafka.listener.DeadLetterPublishingRecoverer: DEBUG
    org.springframework.kafka.support.serializer: DEBUG
    org.apache.kafka.clients.consumer: INFO
