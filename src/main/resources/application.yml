spring:
  config:
    import: optional:file:.env[.properties]

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

pg:
  toss:
    url: https://api.tosspayments.com
    secret-key: ${TOSS_SECRET_KEY}
