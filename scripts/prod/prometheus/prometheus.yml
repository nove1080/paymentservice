global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"

    static_configs:
      - targets: ["localhost:9090"]
        labels:
          app: "prometheus"

  - job_name: "payment-service"
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
        - 'prod-application-1:8080'
        - 'prod-application-2:8080'
        - 'prod-application-3:8080'
